<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Neural OS</title>
  <meta name="description" content="Deine eigene, private KI – vom USB-Stick, mit allem, was sie über dich weiß.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#090a0a">
  <meta name="referrer" content="no-referrer">

  <!--
    Every byte this page loads comes from this server. No font service, no CDN,
    no analytics, no favicon request to a third party - the icon below is an
    inline data URI, which the server's CSP (img-src 'self' data: blob:) allows.
    It carries the same mark as ICONS.brand in app.js.

    There is deliberately NO inline <script> anywhere in this file: the server
    sends `script-src 'self'`, and the whole point of that header is that it
    needs no exception. The cost is that a stored light theme is applied a few
    milliseconds after first paint. Dark is the default, and the bare :root in
    app.css is dark, so the usual first paint is already the right one.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='5' fill='%23101112'/%3E%3Cg fill='none' stroke='%23eeeef0' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M16.2 7.1A6.8 6.8 0 1 1 12.9 3.8'/%3E%3Cpath d='M11.6 8.4 13.6 6.4'/%3E%3C/g%3E%3Ccircle cx='14.8' cy='5.2' r='1.5' fill='%23eeeef0'/%3E%3Ccircle cx='10' cy='10' r='2.2' fill='%23eeeef0'/%3E%3C/svg%3E">
  <!--
    Zum Home-Bildschirm hinzufuegen, auf iPad und iPhone.

    Neural OS gibt es nicht im App Store und wird es nicht geben: es ist keine
    App, sondern ein Programm, das auf einem eigenen Rechner laeuft. Was es
    stattdessen gibt, steht hier: mit Manifest und einem echten PNG-Symbol legt
    Safari beim "Zum Home-Bildschirm" ein richtiges Symbol an und oeffnet die
    Oberflaeche ohne Browserleiste. Das SVG-Favicon oben reicht dafuer nicht --
    iOS nimmt an dieser Stelle ausschliesslich PNG.

    `apple-mobile-web-app-capable` ist veraltet und steht trotzdem hier: die
    iPad-Fassungen, die im Umlauf sind, lesen weiterhin nur diese Zeile und
    ignorieren `display: standalone` aus dem Manifest.
  -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Neural OS">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <a class="skip-link" href="#view">Zum Inhalt springen</a>

  <!--
    Die Schale nach docs/vorlage/app.png: links die Leiste, in der Mitte die
    grosse Karte mit Kopf und Ansicht, rechts die Spalte mit den Kacheln.
    app.js fuellt Leiste, Kopf und Spalte. Bis dahin steht hier das Geruest,
    damit das erste Bild schon die richtige Aufteilung hat. `is-booting`
    haelt die Einklapp-Bewegung an, bis der gemerkte Zustand gesetzt ist.
  -->
  <div class="shell is-booting" id="shell" data-links="offen" data-rechts="offen">
    <nav class="rail" id="rail" aria-label="Hauptbereiche"></nav>

    <section class="stage" id="stage">
      <header class="topbar" id="topbar">
        <h1 class="topbar__title">Neural OS</h1>
      </header>

      <main class="main" id="view" tabindex="-1" role="main">
        <div class="view-state">
          <div class="spinner" aria-hidden="true"></div>
          <p class="view-state__text">Wird geladen …</p>
        </div>
      </main>
    </section>

    <aside class="aside" id="aside" aria-label="Übersicht"></aside>

    <div class="shell__scrim" id="scrim" aria-hidden="true"></div>
  </div>

  <div class="toasts" id="toasts" role="region" aria-label="Meldungen" aria-live="polite"></div>
  <div id="overlays"></div>

  <noscript>
    <div class="noscript">
      <h2>JavaScript ist deaktiviert</h2>
      <p>
        Neural OS läuft vollständig auf diesem Gerät, die Oberfläche wird aber im Browser
        zusammengebaut. Ohne JavaScript bleibt sie leer. Deine Daten sind davon nicht betroffen:
        sie liegen als Dateien in deinem Neural-OS-Verzeichnis und lassen sich auch ohne diese
        Anwendung lesen und sichern.
      </p>
    </div>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
