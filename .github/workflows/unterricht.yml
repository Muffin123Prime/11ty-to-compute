# Baut und veröffentlicht die Unterrichts-App (unterricht/) auf Cloudflare Workers,
# sobald sich dort etwas ändert. Pflicht-Secret im Repo
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   Token mit der Vorlage "Edit Cloudflare Workers"
# Empfohlen:
#   APP_KEY                selbst gewähltes Passwort für die App
# Optional (nur wenn nicht Workers AI genutzt wird):
#   GROQ_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, CLOUDFLARE_ACCOUNT_ID
name: Unterrichts-App deployen

on:
  push:
    branches: [main, tiktok-auto-pipeline, claude/classroom-lecture-qa-app-o5cx2u]
    paths: ["unterricht/**", ".github/workflows/unterricht.yml"]
  workflow_dispatch:

concurrency:
  group: unterricht-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unterricht
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unterricht/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Auf Cloudflare veröffentlichen
        run: npm run deploy
      - name: Secrets setzen (nur die, die im Repo hinterlegt sind)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          for name in APP_KEY GROQ_API_KEY GEMINI_API_KEY ANTHROPIC_API_KEY; do
            wert="${!name}"
            if [ -n "$wert" ]; then
              printf '%s' "$wert" | npx wrangler secret put "$name"
              echo "$name gesetzt"
            else
              echo "$name nicht hinterlegt, übersprungen"
            fi
          done
      - name: Adresse anzeigen
        run: |
          echo "## Fertig" >> "$GITHUB_STEP_SUMMARY"
          echo "Die App läuft unter der Adresse, die oben im Schritt 'Auf Cloudflare veröffentlichen' steht (https://unterricht.<name>.workers.dev)." >> "$GITHUB_STEP_SUMMARY"
